location = /railway-planner { return 301 https://another1332.me/railway-planner/$is_args$args; }

location = /railway-planner/api/search {
    limit_req zone=railway_search burst=4 nodelay;
    include /etc/nginx/snippets/railway-planner-api.conf;
    proxy_pass http://127.0.0.1:8797/api/search;
}

location ^~ /railway-planner/api/ {
    include /etc/nginx/snippets/railway-planner-api.conf;
    proxy_pass http://127.0.0.1:8797/api/;
}

location /railway-planner/ {
    alias /opt/another1332-railway/current/web/;
    index index.html;
    gzip_types application/json application/javascript text/css image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
}
